name: Deploy-Angular-TodoApp-Develop

on:
  workflow_dispatch:
    inputs:
      build_run_id:
        description: 'Build Run ID to deploy (optional - uses latest if not specified)'
        required: false
        type: string

env:
  ARTIFACT_NAME: 'angular-build-output'
  IIS_SITE_NAME: 'todoapp'
  BACKUP_PATH: 'C:\IIS\BACKUPS\todoapp'
  IIS_APP_POOL_NAME: 'todoapp'
  DEPLOYMENT_PATH: 'C:\inetpub\wwwroot\todoapp'
  OUTPUT_PATH: './dist/todoapp/browser'

jobs:
  build-and-deploy:
    name: Build, Security Scan & Deploy - Develop
    runs-on: [self-hosted]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Necesario para que Gitleaks analice todo el historial de commits si es necesario

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'

      - name: Install dependencies
        run: npm ci

      # --- NUEVO: Control de Calidad y Seguridad ---
      - name: Run Security Audit on Dependencies
        run: |
          Write-Host "Running npm audit..."
          try {
            npm audit --audit-level=critical
            Write-Host "[SUCCESS] No critical vulnerabilities found."
          } catch {
            Write-Host "[WARNING] Vulnerabilities detected, but continuing lab execution as configured."
          }
        shell: powershell

      - name: Scan Code for Secrets (Gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # ---------------------------------------------

      - name: Build application
        run: npm run build -- --configuration production

      - name: Display artifact contents
        run: |
          Write-Host "======================================="
          Write-Host "Artifact Contents:"
          Write-Host "======================================="
          Get-ChildItem -Path "${{ env.OUTPUT_PATH }}" -Recurse | Select-Object FullName, Length
        shell: powershell

      - name: Stop IIS Application Pool
        run: |
          Write-Host "Stopping IIS App Pool: ${{ env.IIS_APP_POOL_NAME }}"
          try {
            Import-Module WebAdministration
            Stop-WebAppPool -Name "${{ env.IIS_APP_POOL_NAME }}" -ErrorAction Stop
            Write-Host "[SUCCESS] App Pool stopped successfully"
            Start-Sleep -Seconds 3
          } catch {
            Write-Host "[ERROR] Error stopping app pool: $_"
            exit 1
          }
        shell: powershell

      - name: Backup current deployment
        run: |
          if (!(Test-Path "${{ env.BACKUP_PATH }}")) {
            New-Item -ItemType Directory -Path "${{ env.BACKUP_PATH }}" -Force | Out-Null
          }
          $backupPath = "${{ env.BACKUP_PATH }}\${{ env.IIS_SITE_NAME }}_backup_$(Get-Date -Format 'yyyyMMdd_HHmmss')"
          if (Test-Path "${{ env.DEPLOYMENT_PATH }}") {
            Write-Host "Creating backup at: $backupPath"
            Copy-Item -Path "${{ env.DEPLOYMENT_PATH }}" -Destination $backupPath -Recurse -Force
            Write-Host "[SUCCESS] Backup created successfully"
          } else {
            Write-Host "[INFO] No existing deployment found. Skipping backup."
          }
        shell: powershell

      - name: Clear deployment directory
        run: |
          Write-Host "Clearing deployment directory: ${{ env.DEPLOYMENT_PATH }}"
          if (Test-Path "${{ env.DEPLOYMENT_PATH }}") {
            Remove-Item -Path "${{ env.DEPLOYMENT_PATH }}\*" -Recurse -Force -ErrorAction Stop
            Write-Host "[SUCCESS] Deployment directory cleared"
          } else {
            Write-Host "Creating deployment directory..."
            New-Item -ItemType Directory -Path "${{ env.DEPLOYMENT_PATH }}" -Force | Out-Null
            Write-Host "[SUCCESS] Deployment directory created"
          }
        shell: powershell

      - name: Deploy new files
        run: |
          Write-Host "Deploying files to: ${{ env.DEPLOYMENT_PATH }}"
          try {
            Copy-Item -Path "${{ env.OUTPUT_PATH }}\*" -Destination "${{ env.DEPLOYMENT_PATH }}" -Recurse -Force -ErrorAction Stop
            Write-Host "[SUCCESS] Files deployed successfully"
            Write-Host "======================================="
            Write-Host "Deployed contents:"
            Write-Host "======================================="
            Get-ChildItem -Path "${{ env.DEPLOYMENT_PATH }}" -Recurse | Select-Object FullName
          } catch {
            Write-Host "[ERROR] Error deploying files: $_"
            exit 1
          }
        shell: powershell

      - name: Start IIS Application Pool
        run: |
          Write-Host "Starting IIS App Pool: ${{ env.IIS_APP_POOL_NAME }}"
          try {
            Import-Module WebAdministration
            Start-WebAppPool -Name "${{ env.IIS_APP_POOL_NAME }}" -ErrorAction Stop
            Write-Host "[SUCCESS] App Pool started successfully"
            Start-Sleep -Seconds 5
          } catch {
            Write-Host "[ERROR] Error starting app pool: $_"
            exit 1
          }
        shell: powershell

      - name: Verify IIS Application Pool status
        run: |
          Write-Host "Verifying IIS App Pool status..."
          try {
            Import-Module WebAdministration
            $poolStatus = Get-WebAppPoolState -Name "${{ env.IIS_APP_POOL_NAME }}"
            Write-Host "App Pool Status: $($poolStatus.Value)"
            if ($poolStatus.Value -ne "Started") {
              Write-Host "[WARNING] App Pool is not in 'Started' state"
              exit 1
            }
            Write-Host "[SUCCESS] App Pool is running"
          } catch {
            Write-Host "[ERROR] Error checking app pool status: $_"
            exit 1
          }
        shell: powershell

      - name: Deployment Summary
        if: success()
        run: |
          Write-Host ""
          Write-Host "========================================"
          Write-Host "      Deployment Completed [SUCCESS]    "
          Write-Host "========================================"
          Write-Host "Environment: Develop"
          Write-Host "Site Name: ${{ env.IIS_SITE_NAME }}"
          Write-Host "App Pool: ${{ env.IIS_APP_POOL_NAME }}"
          Write-Host "Deployment Path: ${{ env.DEPLOYMENT_PATH }}"
          Write-Host "Deployed At: $(Get-Date -Format 'yyyy-MM-dd HH:mm:ss')"
          Write-Host ""
        shell: powershell

      - name: Deployment Failed Notification
        if: failure()
        run: |
          Write-Host ""
          Write-Host "========================================"
          Write-Host "      Deployment Failed [ERROR]         "
          Write-Host "========================================"
          Write-Host "Please check the logs above for details."
          Write-Host "Failed At: $(Get-Date -Format 'yyyy-MM-dd HH:mm:ss')"
          Write-Host ""
          Write-Host "Starting IIS App Pool: ${{ env.IIS_APP_POOL_NAME }}"
          try {
            Import-Module WebAdministration
            Start-WebAppPool -Name "${{ env.IIS_APP_POOL_NAME }}" -ErrorAction Stop
            Write-Host "[SUCCESS] App Pool started successfully"
            Start-Sleep -Seconds 5
          } catch {
            Write-Host "[ERROR] Error starting app pool: $_"
            exit 1
          }
        shell: powershell
